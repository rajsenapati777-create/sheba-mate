<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheba Mate</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6fa;
  font-family: Arial, sans-serif;
  color: #222;
}

header {
  background: white;
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
}

header span {
  color: #e5a900;
}

.banner {
  margin: 15px;
  background: #263653;
  color: white;
  padding: 25px 20px;
  border-radius: 14px;
  min-height: 155px;
}

.slide {
  display: none;
}

.slide.active {
  display: block;
}

.slide h2 {
  font-size: 25px;
}

.dots {
  text-align: center;
}

.dot {
  display: inline-block;
  background: #bbb;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin: 5px;
}

.dot.active {
  background: #e5a900;
}

h3 {
  margin: 22px 15px;
}

.services {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 15px;
}

.service {
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

.photo {
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  background: #e9edf3;
}

.info {
  padding: 12px;
}

.price {
  color: green;
  font-weight: bold;
  margin: 10px 0;
}

button {
  background: #f4b400;
  border: 0;
  padding: 11px;
  border-radius: 7px;
  width: 100%;
  font-weight: bold;
  cursor: pointer;
}

.whatsapp {
  display: block;
  margin: 22px 15px;
  background: #168b4b;
  color: white;
  text-align: center;
  padding: 16px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
}
</style>
</head>

<body>

<header>Sheba <span>Mate</span></header>

<div class="banner">

<div class="slide active">
<h2>Welcome to Sheba Mate</h2>
<p>Your Trusted Home Service Partner</p>
</div>

<div class="slide">
<h2>Professional Home Cleaning</h2>
<p>Quality Service at Affordable Prices</p>
</div>

<div class="slide">
<h2>Book Your Service Today</h2>
<p>Easy and Quick WhatsApp Booking</p>
</div>

</div>

<div class="dots">
<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

<h3>Our Services</h3>

<div class="services" id="services"></div>

<a class="whatsapp" id="generalBooking" target="_blank">
Book Now on WhatsApp
</a>

<footer>
© 2026 Sheba Mate. All Rights Reserved.
</footer>

<script>

const PHONE = "8910952519";

const services = [
{name: "Home Cleaning", price: 250, icon: "🏠"},
{name: "Bathroom Cleaning", price: 250, icon: "🚿"},
{name: "Kitchen Cleaning", price: 250, icon: "🍳"},
{name: "Water Tank Cleaning", price: 250, icon: "💧"},
{name: "Painter Service", price: 599, icon: "🎨"},
{name: "Coconut Climber", price: 99, icon: "🌴"}
];

services.forEach(s => {

const msg = `Hello, I want to book ${s.name} Service.
Price: ₹${s.price}
Please confirm my booking.`;

document.getElementById("services").innerHTML += `
<div class="service">
<div class="photo">${s.icon}</div>
<div class="info">
<strong>${s.name}</strong>
<div class="price">₹${s.price}</div>
<button onclick="window.open('https://wa.me/${PHONE}?text='+encodeURIComponent('${msg}'),'_blank')">
Book Now
</button>
</div>
</div>
`;

});

document.getElementById("generalBooking").href =
"https://wa.me/" + PHONE +
"?text=" + encodeURIComponent("Hello, I want to know about your home services.");

let currentSlide = 0;

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

setInterval(() => {

slides[currentSlide].classList.remove("active");
dots[currentSlide].classList.remove("active");

currentSlide = (currentSlide + 1) % slides.length;

slides[currentSlide].classList.add("active");
dots[currentSlide].classList.add("active");

}, 3000);

</script>

</body>
</html>
